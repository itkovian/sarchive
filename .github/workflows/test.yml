name: sarchive tests
on: [push, pull_request]
jobs:
  semver-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Ensure we include all new non-default features here explicitly, except for
          # pass-through mutually-exclusive features from our dependencies such as:
          # https://github.com/obi1kenobi/cargo-semver-checks/pull/824
          feature-group: default-features

  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans

    # Prevent sudden announcement of a new advisory from failing ci:
    continue-on-error: ${{ matrix.checks == 'advisories' }}

    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check ${{ matrix.checks }}
          log-level: warn
          arguments: --all-features

  fmt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
      fail-fast: false

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install toolchain
        uses: actions-rs/toolchain@v1.0.7
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt
          override: true
      - name: Run cargo fmt
        uses: actions-rs/cargo@v1.0.3
        with:
          command: fmt
          args: --all -- --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - nightly
        features:
          - --features kafka
          - --no-default-features
          - --all-features
      fail-fast: false

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install toolchain
        uses: actions-rs/toolchain@v1.0.7
        with:
          toolchain: ${{ matrix.rust }}
          override: true
      - run: sudo apt-get install libsasl2-dev  libsasl2-2
      - name: Run cargo test
        uses: actions-rs/cargo@v1.0.3
        with:
          command: test
          args: ${{ matrix.features }}
